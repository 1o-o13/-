<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>표정 촬영</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; background: #f6f7f9; color: #1d2330; margin: 0; }
  main { max-width: 820px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; } .sub { color: #5b6475; font-size: 14px; margin-bottom: 18px; line-height: 1.6; }
  .card { background: #fff; border: 1px solid #dfe3ea; border-radius: 12px; padding: 20px; display: flex; gap: 20px; flex-wrap: wrap; }
  video { width: 400px; max-width: 100%; border-radius: 8px; background: #000; transform: scaleX(-1); }
  .label { display: inline-block; font-size: 15px; font-weight: 700; color: #fff; background: #2457d6; border-radius: 6px; padding: 4px 10px; }
  .hint { font-size: 19px; margin: 12px 0; line-height: 1.5; } .count { font-size: 44px; font-weight: 700; color: #d6342c; min-height: 56px; }
  button { font: inherit; font-size: 15px; padding: 10px 18px; border-radius: 8px; border: 1px solid #2457d6; background: #2457d6; color: #fff; cursor: pointer; }
  button:disabled { opacity: .45; } .list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .list span { font-size: 12px; padding: 4px 8px; border-radius: 6px; background: #e8ebf0; cursor: pointer; }
  .list span.done { background: #d9f0df; color: #1c6b34; } .list span.cur { outline: 2px solid #2457d6; }
</style>
</head>
<body>
<main>
  <h1>표정 촬영 (얼굴·표정 모델 비교용)</h1>
  <div class="sub">8가지를 차례로 찍습니다. '촬영'을 누르면 3초 뒤 0.6초 간격으로 5장을 찍습니다.
    사진은 이 PC의 bench/data/face에만 저장되고, 비교가 끝나면 지울 수 있습니다. 밝은 곳에서 얼굴이 화면 가운데 오게 해 주세요.</div>
  <div class="card">
    <video id="v" autoplay muted playsinline></video>
    <div style="flex:1;min-width:260px">
      <span class="label" id="label"></span>
      <div class="hint" id="hint">카메라를 켜는 중…</div>
      <div class="count" id="count"></div>
      <button id="go" disabled>촬영</button>
      <div class="list" id="list"></div>
      <p id="state" style="color:#5b6475;font-size:14px"></p>
    </div>
  </div>
</main>
<script>
let items = [], idx = 0;
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function load() {
  $("v").srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
  items = await (await fetch("/face/items")).json(); const f = items.findIndex((x) => !x.done); show(f < 0 ? 0 : f); $("go").disabled = false;
}
function show(i) {
  idx = i; const it = items[i];
  $("label").textContent = it.label; $("hint").textContent = it.hint; $("count").textContent = "";
  $("list").innerHTML = items.map((x, k) => `<span class="${x.done ? "done" : ""} ${k === i ? "cur" : ""}" data-k="${k}">${x.label}</span>`).join("");
  $("list").querySelectorAll("span").forEach((s) => (s.onclick = () => show(+s.dataset.k)));
}
function frame() {
  const v = $("v"), c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0); return new Promise((r) => c.toBlob(r, "image/jpeg", 0.92));
}
$("go").onclick = async () => {
  const it = items[idx]; $("go").disabled = true;
  for (let s = 3; s > 0; s--) { $("count").textContent = s; await sleep(1000); }
  for (let n = 1; n <= it.shots; n++) {
    $("count").textContent = `📸 ${n}/${it.shots}`;
    await fetch(`/save-face/${it.key}/${n}`, { method: "POST", body: await frame() }); await sleep(600);
  }
  it.done = true; $("go").disabled = false; const next = items.findIndex((x) => !x.done);
  if (next < 0) { show(idx); $("state").textContent = "8가지 모두 찍었습니다. 고맙습니다!"; return; }
  show(next);
};
load().catch((e) => ($("hint").textContent = "카메라를 열 수 없습니다: " + e.message));
</script>
</body>
</html>
