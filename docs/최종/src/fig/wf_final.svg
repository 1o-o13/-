<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='720' viewBox='0 0 1500 720' font-family="'Malgun Gothic', sans-serif"><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='ab' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5f59e0'/></marker></defs><rect width='1500' height='720' fill='white'/><text x='750.0' y='34' font-size='19' fill='#2a2857' text-anchor='middle' font-weight='700'>안쪽 흐름 ④ 최종 평가 → 확정 → 2차 종합 → 최종 결정</text><text x='750.0' y='58' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='400'>AI는 점수와 추천까지, 확정과 합격 결정은 담당자</text><rect x='40' y='90' width='230' height='96' rx='10' fill='#f8fafc' stroke='#94a3b8' stroke-width='1.5'/><text x='155.0' y='133.475' font-size='13.5' fill='#1f2937' text-anchor='middle' font-weight='700'>10문항 끝</text><text x='155.0' y='151.975' font-size='12.0' fill='#6b7280' text-anchor='middle' font-weight='400'>주제별로 묶기</text><rect x='318' y='90' width='230' height='96' rx='10' fill='#f8fafc' stroke='#94a3b8' stroke-width='1.5'/><text x='433.0' y='124.225' font-size='13.5' fill='#1f2937' text-anchor='middle' font-weight='700'>주제 점수</text><text x='433.0' y='142.725' font-size='12.0' fill='#6b7280' text-anchor='middle' font-weight='400'>깊이(0·30·60)</text><text x='433.0' y='161.225' font-size='12.0' fill='#6b7280' text-anchor='middle' font-weight='400'>+ 40 × 평균 / 100</text><path d='M270,138.0 L318,138.0' fill='none' stroke='#6b7280' stroke-width='1.6'  marker-end='url(#a)'/><rect x='596' y='90' width='230' height='96' rx='10' fill='#f8fafc' stroke='#94a3b8' stroke-width='1.5'/><text x='711.0' y='133.475' font-size='13.5' fill='#1f2937' text-anchor='middle' font-weight='700'>최종 평가 v1</text><text x='711.0' y='151.975' font-size='12.0' fill='#6b7280' text-anchor='middle' font-weight='400'>내용 60 ·