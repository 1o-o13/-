<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='636' viewBox='0 0 1500 636' font-family="'Malgun Gothic', sans-serif"><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='ab' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5f59e0'/></marker></defs><rect width='1500' height='636' fill='white'/><text x='750.0' y='34' font-size='19' fill='#2a2857' text-anchor='middle' font-weight='700'>조회 경로 ⑥ 응시 → 감독 이벤트 → 의심 건 → 담당자 결정</text><text x='750.0' y='58' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='400'>감독 기록에서 담당자 결정까지</text><rect x='60' y='80' width='860' height='74' rx='8' fill='white' stroke='#8b7cf6' stroke-width='1.6'/><rect x='60' y='80' width='230' height='74' rx='8' fill='#8b7cf6'/><rect x='282' y='80' width='8' height='74' fill='#8b7cf6'/><text x='175' y='123.0' font-size='15' fill='white' text-anchor='middle' font-weight='700'>interview_session</text><rect x='306' y='102' width='51.2' height='30' rx='15' fill='#fde68a'/><text x='332' y='122' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>id</text><text x='315' y='122' font-size='11'>🔑</text><rect x='365.2' y='102' width='142.39999999999998' height='30' rx='15' fill='#e0e7ff'/><text x='391.2' y='122' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>application_id</text><text x='374.2' y='122' font-size='11'>🔗</text><text x='944' y='122.0' font-size='13' fill='#6b7280' text-anchor='start' font-weight='400'>응시</text><path d='M175,154 V224' stroke='#5f59e0' stroke-width='2' fill='none' marker-end='url(#ab)'/><rect x='195' y='174' width='669' height='30' rx='6' fill='#f1f0fe'/><text x='210' y='194' font-size='13' fill='#2a2857' font-family='Consolas, monospace' font-weight='600'>JOIN proctor_event pe ON pe.session_id = s.id   (pe.question_id 로 문항까지)</text><rect x='60' y='224' width='860' height='74' rx='8' fill='white' stroke='#34d399' stroke-width='1.6'/><rect x='60' y='224' width='230' height='74' rx='8' fill='#34d399'/><rect x='282' y='224' width='8' height='74' fill='#34d399'/><text x='175' y='267.0' font-size='15' fill='white' text-anchor='middle' font-weight='700'>proctor_event</text><rect x='306' y='246' width='51.2' height='30' rx='15' fill='#fde68a'/><text x='332' y='266' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>id</text><text x='315' y='266' font-size='11'>🔑</text><rect x='365.2' y='246' width='112.0' height='30' rx='15' fill='#e0e7ff'/><text x='391.2' y='266' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>session_id</text><text x='374.2' y='266' font-size='11'>🔗</text><rect x='485.2' y='246' width='119.6' height='30' rx='15' fill='#e0e7ff'/><text x='511.2' y='266' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>question_id</text><text x='494.2' y='266' font-size='11'>🔗</text><rect x='612.8' y='246' width='94.0' height='30' rx='15' fill='#f1f5f9'/><text x='621.8' y='266' font-size='13' fill='#1f2937' text-anchor='start' font-weight='400'>event_type</text><text x='944' y='266.0' font-size='13' fill='#6b7280' text-anchor='start' font-weight='400'>탭 이탈·얼굴 없음 등</text><path d='M175,298 V368' stroke='#5f59e0' stroke-width='2' fill='none' marker-end='url(#ab)'/><rect x='195' y='318' width='534' height='30' rx='6' fill='#f1f0fe'/><text x='210' y='338' font-size='13' fill='#2a2857' font-family='Consolas, monospace' font-weight='600'>JOIN suspicion_case sc ON sc.interview_session_id = s.id</text><rect x='60' y='368' width='860' height='74' rx='8' fill='white' stroke='#fb923c' stroke-width='1.6'/><rect x='60' y='368' width='230' height='74' rx='8' fill='#fb923c'/><rect x='282' y='368' width='8' height='74' fill='#fb923c'/><text x='175' y='411.0' font-size='15' fill='white' text-anchor='middle' font-weight='700'>suspicion_cas