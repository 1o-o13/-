<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='924' viewBox='0 0 1500 924' font-family="'Malgun Gothic', sans-serif"><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='ab' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5f59e0'/></marker></defs><rect width='1500' height='924' fill='white'/><text x='750.0' y='34' font-size='19' fill='#2a2857' text-anchor='middle' font-weight='700'>조회 경로 ① 지원자 → 지원 건 → 응시 → 질문 → 답변 → 판정</text><text x='750.0' y='58' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='400'>지원자 한 명의 면접 문항별 답변과 점수를 찾을 때 지나는 길</text><rect x='60' y='80' width='860' height='74' rx='8' fill='white' stroke='#60a5fa' stroke-width='1.6'/><rect x='60' y='80' width='230' height='74' rx='8' fill='#60a5fa'/><rect x='282' y='80' width='8' height='74' fill='#60a5fa'/><text x='175' y='123.0' font-size='15' fill='white' text-anchor='middle' font-weight='700'>candidate</text><rect x='306' y='102' width='51.2' height='30' rx='15' fill='#fde68a'/><text x='332' y='122' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>id</text><text x='315' y='122' font-size='11'>🔑</text><rect x='365.2' y='102' width='56.0' height='30' rx='15' fill='#f1f5f9'/><text x='374.2' y='122' font-size='13' fill='#1f2937' text-anchor='start' font-weight='400'>email</text><rect x='429.2' y='102' width='48.4' height='30' rx='15' fill='#f1f5f9'/><text x='438.2' y='122' font-size='13' fill='#1f2937' text-anchor='start' font-weight='400'>name</text><text x='944' y='122.0' font-size='13' fill='#6b7280' text-anchor='start' font-weight='400'>지원자 계정</text><path d='M175,154 V224' stroke='#5f59e0' stroke-width='2' fill='none' marker-end='url(#ab)'/><rect x='195' y='174' width='579' height='30' rx='6' fill='#f1f0fe'/><text x='210' y='194' font-size='13' fill='#2a2857' font-family='Consolas, monospace' font-weight='600'>JOIN application a ON a.candidate_id = candidate.id   (1 : N)</text><rect x='60' y='224' width='860' height='74' rx='8' fill='white' stroke='#60a5fa' stroke-width='1.6'/><rect x='60' y='224' width='230' height='74' rx='8' fill='#60a5fa'/><rect x='282' y='224' width='8' height='74' fill='#60a5fa'/><text x='175' y='267.0' font-size='15' fill='white' text-anchor='middle' font-weight='700'>application</text><rect x='306' y='246' width='51.2' height='30' rx='15' fill='#fde68a'/><text x='332' y='266' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>id</text><text x='315' y='266' font-size='11'>🔑</text><rect x='365.2' y='246' width='127.19999999999999' height='30' rx='15' fill='#e0e7ff'/><text x='391.2' y='266' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>candidate_id</text><text x='374.2' y='266' font-size='11'>🔗</text><rect x='500.4' y='246' width='112.0' height='30' rx='15' fill='#e0e7ff'/><text x='526.4' y='266' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>posting_id</text><text x='509.4' y='266' font-size='11'>🔗</text><rect x='620.4' y='246' width='63.599999999999994' height='30' rx='15' fill='#f1f5f9'/><text x='629.4' y='266' font-size='13' fill='#1f2937' text-anchor='start' font-weight='400'>status</text><text x='944' y='266.0' font-size='13' fill='#6b7280' text-anchor='start' font-weight='400'>지원 건 — 공고마다 하나</text><path d='M175,298 V368' stroke='#5f59e0' stroke-width='2' fill='none' marker-end='url(#ab)'/><rect x='195' y='318' width='642' height='30' rx='6' fill='#f1f0fe'/><text x='210' y='338' font-size='13' fill='#2a2857' font-family='Consolas, monospace' font-weight='600'>JOIN interview_session s ON s.application_id = a.id   (1 : N, 최대 3차)</text><rect x='60' y='368' width='860' height='74' rx='8' fill='white' stroke='#8b7cf6' stroke-width='1.6'/><rect x='60' y='368' width='230' height='74' rx='8' fill='#8b7cf6'/><rect x='282' y='368' width='8' height='74' fill='#8b7cf6'/><text x='175' y='411.0' font-size='15' fill='white' text-anchor='middle' font-weight='700'>interview_session</text><rect x='306' y='390' width='51.2' height='30' rx='15' fill='#fde68a'/><text x='332' y='410' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>id</text><text x='315' y='410' font-size='11'>🔑</text><rect x='365.2' y='390' width='142.39999999999998' height='30' rx='15' fill='#e0e7ff'/><text x='391.2' y='410' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>application_id</text><text x='374.2' y='410' font-size='11'>🔗</text><rect x='515.5999999999999' y='390' width='94.0' height='30' rx='15' fill='#f1f5f9'/><text x='524.5999999999999' y='410' font-size='13' fill='#1f2937' text-anchor='start' font-weight='400'>attempt_no</text><rect x='617.5999999999999' y='390' width='63.599999999999994' height='30' rx='15' fill='#f1f5f9'/><text x='626.5999999999999' y='410' font-size='13' fill='#1f2937' text-anchor='start' font-weight='400'>status</text><text x='944' y='410.0' font-size='13' fill='#6b7280' text-anchor='start' font-weight='400'>응시 1회</text><path d='M175,442 V512' stroke='#5f59e0' stroke-width='2' fill='none' marker-end='url(#ab)'/><rect x='195' y='462' width='606' height='30' rx='6' fill='#f1f0fe'/><text x='210' y='482' font-size='13' fill='#2a2857' font-family='Consolas, monospace' font-weight='600'>JOIN interview_question q ON q.session_id = s.id   (1 : N, 10문항)</text><rect x='60' y='512' width='860' height='74' rx='8' fill='white' stroke='#8b7cf6' stroke-width='1.6'/><rect x='60' y='512' width='230' height='74' rx='8' fill='#8b7cf6'/><rect x='282' y='512' width='8' height='74' fill='#8b7cf6'/><text x='175' y='555.0' font-size='15' fill='white' text-anchor='middle' font-weight='700'>interview_question</text><rect x='306' y='534' width='51.2' height='30' rx='15' fill='#fde68a'/><text x='332' y='554' font-size='13' fill='#1f2937' text-anchor='start' font-weight='600'>id</text